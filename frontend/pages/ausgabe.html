<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lohnabrechnung Ausgabe</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <script>
      const loggedInUser = JSON.parse(sessionStorage.getItem("loggedInUser"));
      if (!loggedInUser) {
        window.location.href = "../pages/auth.html";
      }
      if (!sessionStorage.getItem("loggedInUser")) {
        const localUser = JSON.parse(localStorage.getItem("loggedInUser"));
        if (localUser) {
          sessionStorage.setItem("loggedInUser", JSON.stringify(localUser));
        } else {
          window.location.href = "../pages/auth.html";
        }
      }

      document
        .getElementById("signOutButton")
        ?.addEventListener("click", () => {
          sessionStorage.removeItem("loggedInUser");
          localStorage.removeItem("loggedInUser");
          window.location.href = "../pages/auth.html";
        });
    </script>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-primary">
      <div class="container">
        <a
          class="navbar-brand navbar-brand-custom"
          href="../index.html"
          >Lohnabrechnung</a
        >
        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link nav-link-white" href="../pages/eingabe.html"
                >Eingabe</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link nav-link-white" href="../pages/ausgabe.html"
                >Ausgabe</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link nav-link-white" href="../pages/profil.html"
                >Profil</a
              >
            </li>
          </ul>
        </div>
        <button
          id="signOutButton"
          class="btn btn-danger btn-signout"
        >
          Abmelden
        </button>
      </div>
    </nav>
    <div class="container mt-5">
      <h1 class="text-center">Lohnabrechnung Ausgabe</h1>
      <div id="resultsContainer" class="mt-4"></div>
      <div
        id="compare-section"
        class="d-flex justify-content-center mt-4 compare-section"
      >
        <button id="compareButton" class="btn btn-info mx-2">
          Vergleichen
        </button>
        <button id="resetButton" class="btn btn-secondary mx-2">
          Zurücksetzen
        </button>
      </div>
      <div
        id="comparison-table"
        class="comparison-table-hidden"
      >
        <h3 class="text-center">Vergleichsergebnisse:</h3>
        <table class="table table-bordered mt-3" id="comparison-result">
          <tr>
            <th>Lohnabrechnung</th>
            <th>Monat</th>
            <th>Jahr</th>
            <th>Betrag</th>
          </tr>
        </table>
      </div>
      <div class="d-flex justify-content-center mt-4">
        <button id="exportCSV" class="btn btn-primary mx-2">
          Exportieren als CSV
        </button>
        <button id="exportPDF" class="btn btn-secondary mx-2">
          Exportieren als PDF
        </button>
        <button id="editMode" class="btn btn-warning mx-2">Bearbeiten</button>
        <button id="clearData" class="btn btn-danger mx-2">
          Alle Daten löschen
        </button>
      </div>
    </div>
    <script src="../logic/main.js" defer></script>
    <script src="../logic/profil.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  </body>
</html>
